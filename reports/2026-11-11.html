<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지식 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 배치: 날짜별 읽을거리. 맨 위 핵심 3건, 그다음 개념 풀이 한 편(긴 글), 그 아래 도메인 · 기술 소식 해설 */
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --fg: #1c1b19;
  --muted: #615f59;
  --line: #e4e1da;
  --accent: #2f5fb3;
  --domain: #0f7c74;
  --tech: #5a4bc2;
  --warn-bg: #fff3d6;
  --warn-fg: #7a5600;
  --chip-bg: #efede8;
  --code-bg: #f1efe9;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131416; --surface: #1b1c1f; --fg: #e9e7e2; --muted: #a09d96; --line: #2c2d31;
    --accent: #8fb0ff; --domain: #4fd1c5; --tech: #a99cff;
    --warn-bg: #3a2f12; --warn-fg: #f2cf7a; --chip-bg: #26272b; --code-bg: #222327; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131416; --surface: #1b1c1f; --fg: #e9e7e2; --muted: #a09d96; --line: #2c2d31;
  --accent: #8fb0ff; --domain: #4fd1c5; --tech: #a99cff;
  --warn-bg: #3a2f12; --warn-fg: #f2cf7a; --chip-bg: #26272b; --code-bg: #222327; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 var(--font-body); padding: 0 16px; word-break: keep-all; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 40px 64px; display: grid; gap: 44px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header { display: grid; gap: 10px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); line-height: 1.2; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.range { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 13px/1.5 var(--font-mono); color: var(--muted); }
.tally { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tally a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; }
.tally a:hover { border-color: var(--muted); }
.tally b { font: 500 13px var(--font-mono); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }

/* 핵심 */
.highlights { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.hl { display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.hl .rank { grid-row: span 3; font: 500 26px/1 var(--font-mono); color: var(--c); padding-top: 2px; }
.hl .who { font-size: 12px; font-weight: 600; color: var(--c); }
.hl .title { font-size: 17px; font-weight: 600; line-height: 1.45; min-width: 0; }
.hl .impact { color: var(--muted); min-width: 0; }

/* 개념 풀이 */
.concepts { display: grid; gap: 28px; }
.concept { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 12px; padding: 28px 32px; display: grid; gap: 18px; scroll-margin-top: 16px; }
.concept .tag { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; font-weight: 600; color: var(--c); }
.concept .tag .area { padding: 2px 8px; border-radius: 6px; border: 1px solid var(--c); }
.concept h3 { margin: 0; font-size: clamp(21px, 4vw, 26px); line-height: 1.35; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.concept .oneline { margin: 0; font-size: 16px; line-height: 1.7; padding: 12px 16px; border-radius: 8px; background: var(--chip-bg); }
.concept .related { margin: 0; font-size: 13px; color: var(--muted); }
.concept .related::before { content: "그날 소식과 연결 · "; font-weight: 600; color: var(--fg); }
.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--accent); text-decoration: underline; }
.csec { display: grid; gap: 6px; scroll-margin-top: 16px; }
.csec h4 { margin: 0; font-size: 16px; font-weight: 700; color: var(--fg); }
.csec h4 .n { font: 500 13px var(--font-mono); color: var(--c); margin-right: 8px; }
.csec p { margin: 0; line-height: 1.85; max-width: 68ch; overflow-wrap: anywhere; }
.csec p + p { margin-top: 8px; }
pre.code { margin: 6px 0 0; padding: 14px 16px; border-radius: 8px; background: var(--code-bg); font: 13px/1.6 var(--font-mono); overflow-x: auto; max-width: 100%; }
.code-note { font-size: 12px; color: var(--muted); }
.glossary { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; padding: 14px 16px; border-radius: 8px; background: var(--chip-bg); font-size: 14px; }
.glossary dt { font-weight: 600; }
.glossary dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.refs { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.refs a { overflow-wrap: anywhere; }

/* 소식 해설 */
.block { display: grid; gap: 0; scroll-margin-top: 16px; }
.section-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding-bottom: 10px; border-bottom: 2px solid var(--c); }
.section-head h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.section-head .note { color: var(--muted); font-size: 13px; }
.section-head .count { margin-left: auto; font: 13px var(--font-mono); color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 2px; }
.filters button { font: 500 13px var(--font-body); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.item .cat { align-self: start; justify-self: start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.item .body { display: grid; gap: 6px; min-width: 0; }
.item .title { font-weight: 600; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.item .detail { margin: 0; line-height: 1.85; max-width: 68ch; overflow-wrap: anywhere; }
.item .detail p { margin: 0; }
.item .detail p + p { margin-top: 8px; }
.item .impact { justify-self: start; max-width: 68ch; padding: 8px 12px; border-radius: 8px; background: var(--chip-bg); overflow-wrap: anywhere; }
.item .impact::before { content: "확인할 점 · "; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.meta .date { font-family: var(--font-mono); }
.meta a { overflow-wrap: anywhere; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--warn-bg); color: var(--warn-fg); }
.empty { padding: 18px 0; color: var(--muted); border-bottom: 1px solid var(--line); }

footer { display: grid; gap: 8px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
footer dt { font-weight: 600; color: var(--fg); }
footer dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.nodata { padding: 40px 0; color: var(--muted); }

@media (max-width: 560px) {
  .wrap { padding-block: 24px 48px; gap: 32px; }
  .hl { grid-template-columns: 1fr; padding: 16px; }
  .hl .rank { grid-row: auto; font-size: 18px; }
  .concept { padding: 20px 18px; }
  .item { grid-template-columns: 1fr; gap: 8px; }
  .glossary, footer dl { grid-template-columns: 1fr; }
  .glossary dd { margin-bottom: 6px; }
}
</style>
</head>
<body>
<main class="wrap" id="app">

</main>

   {"term": "깨지는 변경(Breaking Change)", "meaning": "컬럼 삭제나 자료형 변경처럼 기존 소비자가 고치지 않으면 실패하게 되는 변경입니다."},
   {"term": "모델 계약(Model Contract)", "meaning": "dbt 에서 모델 결과의 컬럼 이름 · 자료형 · 제약을 약속하고, 맞지 않으면 빌드를 실패시키는 설정입니다."},
   {"term": "ODCS(Open Data Contract Standard)", "meaning": "Bitol 프로젝트가 공개한, 데이터 계약을 YAML 파일로 적는 표준입니다."},
   {"term": "서비스 수준 약속(Service-Level Agreement)", "meaning": "갱신 주기 · 가용성처럼 데이터나 서비스가 지켜야 할 수준을 정한 약속으로, 흔히 SLA 라고 줄여 씁니다."},
   {"term": "마이그레이션(Migration)", "meaning": "DB 의 테이블 · 컬럼 구조를 바꾸는 스크립트와 그 적용 과정입니다."}
  ],
  "sources": [
   {"label": "dbt 문서: Model contracts", "url": "https://docs.getdbt.com/docs/mesh/govern/model-contracts"},
   {"label": "Bitol: Open Data Contract Standard", "url": "https://bitol-io.github.io/open-data-contract-standard/latest/"}
  ]}],
 "domain": [
  {"kind": "제품", "title": "Databricks 가 Unity Catalog 지표 뷰를 Power BI 시맨틱 모델로 내보내는 기능을 비공개 프리뷰로 공개했습니다.", "detail": "Databricks(데이터 · AI 분석 플랫폼 회사)는 2026-11-10 Unity Catalog(Databricks 의 데이터 권한 · 메타데이터 관리 기능) 지표 뷰(Metric View, 지표를 한 번 정의해 여러 도구가 쓰게 하는 기능)를 Power BI(Microsoft 의 BI 도구)로 내보내는 'Publish to Power BI' 를 소개했습니다. 같은 지표를 Power BI 작업 공간마다 따로 정의하면서 숫자가 서로 어긋나는 문제를 줄이려는 것이 배경입니다.\n이 기능은 지표 뷰 하나를 Power BI 시맨틱 모델의 표 하나로 만들고, 차원은 열로, 측정값은 DAX(Power BI 의 계산식 언어) 측정값으로 옮깁니다. 기본 방식인 DirectQuery(BI 도구가 원본에 매번 직접 조회하는 방식)에서는 모든 조회에 Unity Catalog 권한이 적용됩니다.\n내보내기는 Databricks 에서 Power BI 로 한 방향뿐이어서, Power BI 에서 고친 측정값은 지표 뷰에 반영되지 않습니다. 현재 비공개 프리뷰(Private Preview, 신청한 고객에게만 여는 시험 단계)이며 계정 담당 팀을 통해 신청해야 합니다.", "impact": "지표 정의를 여러 BI 도구에 복사해 쓰고 있다면, 정의를 한 곳에 두고 도구 쪽 수정이 원본에 돌아가지 않는 한 방향 구조로 바꿀 수 있는지 검토합니다.", "date": "2026-11-10", "reported": false, "sources": [{"label": "Databricks 블로그: Unity Catalog Metric Views, now in Power BI", "url": "https://www.databricks.com/blog/unity-catalog-metric-views-now-power-bi-one-unified-governed-semantic-layer-all-your-reporting"}]}
 ],
 "tech": [
  {"area": "백엔드", "title": "Spring for Apache Pulsar 가 Apache 재단의 Pulsar 하위 프로젝트로 옮겨 가고, 2.0.8 이 Spring 아래 마지막 판이 됩니다.", "detail": "Spring 팀은 2026-11-10 Spring for Apache Pulsar(Spring 앱에서 분산 메시징 플랫폼 Apache Pulsar 를 쓰게 하는 라이브러리)를 Apache 소프트웨어 재단(ASF, 오픈소스 프로젝트를 관리하는 비영리 재단)의 Apache Pulsar 하위 프로젝트로 옮긴다고 발표했습니다. 새 이름은 'Apache Pulsar support for Spring' 이고, Pulsar 커뮤니티와 더 가깝게 개발하려는 것이 이유입니다.\nSpring for Apache Pulsar 2.0.8 이 Spring 아래 마지막 판이며, Spring Boot 4.2.0 에서는 2.0.8 을 계속 쓸 수 있습니다. Spring Boot 의 Pulsar 스타터(starter, 의존성과 자동 설정을 묶은 패키지)는 더 이상 관리하지 않고, Spring Cloud Stream(메시지 브로커 연결을 추상화하는 Spring 프로젝트)의 Pulsar 바인더는 5.1.0 이 마지막입니다.\nSpring 은 앞으로 이 프로젝트에 업데이트 · 패치 · 버그 수정을 내지 않고, 모든 유지보수는 Apache Pulsar 프로젝트가 맡습니다. 이후 수정을 받으려면 Pulsar 를 쓰는 Spring 앱은 의존성 좌표와 패키지 import 를 새 Apache 프로젝트 것으로 바꿔야 합니다.", "impact": "Spring Boot 에서 Pulsar 스타터나 Spring Cloud Stream Pulsar 바인더를 쓰는지 확인하고, 업그레이드 계획에 새 Apache 좌표로 옮기는 작업을 넣습니다.", "date": "2026-11-10", "reported": false, "sources": [{"label": "Spring 블로그: Announcing a New Home for Spring for Apache Pulsar", "url": "https://spring.io/blog/2026/11/10/spring-pulsar-new-home-asf"}]},
  {"area": "아키텍처·운영", "title": "코드 실행 호스팅 서비스 Val Town 이 단계적 종료 일정을 발표했습니다.", "detail": "Val Town(웹에서 작은 TypeScript 함수를 써서 바로 실행 · 배포하는 호스팅 서비스)은 2026-11-10 서비스를 단계적으로 종료한다고 발표했습니다. 회사는 클라우드 컴퓨팅 시장에서 경쟁할 수 없었다는 것을 이유로 들었습니다.\n발표 당일 신규 가입과 요금제 상향이 멈췄고, 12-10 에는 SQLite · blob 저장소를 제외한 서비스가 읽기 전용이 됩니다. 2027-01-10 에 나머지 서비스가 끝나고, 2027-02-01 에 Val Town 이 오픈소스로 공개됩니다.\n요금 청구는 발표일부터 멈췄고, 연간 요금을 미리 낸 사용자는 일부를 돌려받습니다. 회사는 Cloudflare · Vercel · Netlify · Render 로 옮기는 안내서를 제공하지만, 글에는 데이터 내보내기 도구에 대한 설명이 없습니다.", "impact": "작은 외부 호스팅 서비스에 정기 작업이나 웹훅을 맡겨 두었다면, 서비스가 끝날 때 옮길 곳과 데이터를 내보내는 방법을 미리 적어 둡니다.", "date": "2026-11-10", "reported": false, "sources": [{"label": "Val Town 블로그: Winding down", "url": "https://blog.val.town/winding-down"}]}
 ],
 "checked": {"domain": ["Databricks 블로그", "Neo4j 블로그(Context Engine 은 10-19 로 기간 밖, NODES 2026 은 11-12 예정)", "dbt 블로그(주소 404 로 확인 못 함)", "데이터 계약 · 계보 · 의사결정 지능 검색(기간 내 없음)", "온톨로지 · 지식 그래프 검색(기간 내 없음)"], "tech": ["spring.io 블로그", "nextjs.org 블로그(기간 내 없음)", "postgresql.org 뉴스(기간 내 없음, 19 정식 출시는 11-19 예정)", "InfoQ(Cloudflare Basin 은 원 발표 10-01, Google Cloud 지출 상한은 원 발표 10-31 로 기간 밖, Pinterest 프로파일링은 원 글 날짜 미확인으로 제외)", "Cloudflare 블로그(기간 내 사후 분석 없음)", "GeekNews", "blog.val.town", "장애 사후 분석 검색(기간 내 없음)"]}}</script>

<script>
(function () {
  var TRACK = {
    domain: { name: "도메인", full: "의사결정 지원 · 데이터 플랫폼", color: "var(--domain)" },
    tech: { name: "기술", full: "서버 · DB · 프레임워크 · 아키텍처 · 운영", color: "var(--tech)" }
  };
  var TECH_AREAS = ["백엔드", "프론트", "데이터·DB", "인프라·보안", "아키텍처·운영"];

  var data;
  try { data = JSON.parse(document.getElementById("digest-data").textContent || "{}"); } catch (e) { data = {}; }
  if (!data || !data.date) return;

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "style") n.style.cssText = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
  function links(sources) {
    return (sources || []).map(function (s) {
      var u = safeUrl(s.url);
      return u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.label || hostOf(u) }) : null;
    });
  }
  function paras(text) {
    return String(text || "").split(/\n\s*\n|\n/).filter(function (t) { return t.trim(); }).map(function (t) { return el("p", { text: t.trim() }); });
  }

  var concepts = Array.isArray(data.concepts) ? data.concepts : [];
  var domain = Array.isArray(data.domain) ? data.domain : [];
  var tech = Array.isArray(data.tech) ? data.tech : [];

  document.title = "지식 노트 " + data.date;
  var app = document.getElementById("app");
  app.textContent = "";

  // 머리
  var tally = el("div", { class: "tally" }, [
    el("a", { href: "#concepts", style: "--c:var(--accent)" }, [el("span", { class: "dot" }), el("span", { text: "개념 풀이" }), el("b", { text: String(concepts.length) })]),
    el("a", { href: "#domain", style: "--c:" + TRACK.domain.color }, [el("span", { class: "dot" }), el("span", { text: "도메인 소식" }), el("b", { text: String(domain.length) })]),
    el("a", { href: "#tech", style: "--c:" + TRACK.tech.color }, [el("span", { class: "dot" }), el("span", { text: "기술 소식" }), el("b", { text: String(tech.length) })])
  ]);
  app.appendChild(el("header", null, [
    el("div", { class: "eyebrow", text: "지식 노트 · 도메인과 기술" }),
    el("h1", { text: data.date + (data.weekday ? " (" + data.weekday + ")" : "") + " 지식 노트" }),
    el("div", { class: "range" }, [
      el("span", { text: "대상 기간 " + (data.range ? data.range.from + " ~ " + data.range.to : "미기재") }),
      data.generatedAt ? el("span", { text: "작성 " + data.generatedAt }) : null,
      el("a", { href: "../index.html", text: "지식 노트 색인 →" })
    ]),
    tally
  ]));

  // 핵심
  var hls = data.highlights || [];
  var hlSection = el("section", null, [el("h2", { text: "핵심" })]);
  if (hls.length) {
    hlSection.appendChild(el("ol", { class: "highlights" }, hls.slice(0, 3).map(function (h, i) {
      var m = TRACK[h.track] || { name: "", color: "var(--accent)" };
      return el("li", { class: "hl", style: "--c:" + m.color }, [
        el("span", { class: "rank", text: String(i + 1).padStart(2, "0") }),
        el("span", { class: "who", text: m.name }),
        el("span", { class: "title", text: h.title || "" }),
        h.impact ? el("span", { class: "impact", text: h.impact }) : null
      ]);
    })));
  } else {
    hlSection.appendChild(el("p", { class: "empty", text: "대상 기간에 영향이 큰 새 소식이 없습니다." }));
  }
  app.appendChild(hlSection);

  // 개념 풀이
  var cSection = el("section", { id: "concepts", style: "scroll-margin-top:16px" }, [el("h2", { text: "개념 풀이" })]);
  if (!concepts.length) {
    cSection.appendChild(el("p", { class: "empty", text: "이번 회차 개념 풀이 없음" }));
  } else {
    var wrap = el("div", { class: "concepts" });
    concepts.forEach(function (c, ci) {
      var m = TRACK[c.track] || { name: "", color: "var(--accent)" };
      var cid = "c" + (ci + 1);
      var secs = Array.isArray(c.sections) ? c.sections : [];
      var art = el("article", { class: "concept", id: cid, style: "--c:" + m.color }, [
        el("div", { class: "tag" }, [el("span", { text: m.name + " 개념" }), c.area ? el("span", { class: "area", text: c.area }) : null]),
        el("h3", { text: c.title || "" }),
        c.oneLine ? el("p", { class: "oneline", text: c.oneLine }) : null,
        c.related ? el("p", { class: "related", text: c.related }) : null,
        secs.length > 2 ? el("nav", { class: "toc", "aria-label": "목차" }, secs.map(function (s, si) {
          return el("a", { href: "#" + cid + "-" + (si + 1), text: (si + 1) + ". " + (s.heading || "") });
        })) : null
      ]);
      secs.forEach(function (s, si) {
        var sec = el("section", { class: "csec", id: cid + "-" + (si + 1) }, [
          el("h4", null, [el("span", { class: "n", text: String(si + 1).padStart(2, "0") }), document.createTextNode(s.heading || "")])
        ].concat(paras(s.body)));
        if (s.code && s.code.text) {
          sec.appendChild(el("pre", { class: "code" }, [el("code", { text: s.code.text })]));
          if (s.code.note) sec.appendChild(el("span", { class: "code-note", text: s.code.note }));
        }
        art.appendChild(sec);
      });
      var gl = Array.isArray(c.glossary) ? c.glossary : [];
      if (gl.length) {
        art.appendChild(el("dl", { class: "glossary" }, [].concat.apply([], gl.map(function (g) {
          return [el("dt", { text: g.term || "" }), el("dd", { text: g.meaning || "" })];
        }))));
      }
      var refs = links(c.sources).filter(Boolean);
      if (refs.length) {
        art.appendChild(el("div", null, [
          el("h2", { text: "더 읽을 자료", style: "margin:0 0 6px" }),
          el("ol", { class: "refs" }, refs.map(function (a) { return el("li", null, [a]); }))
        ]));
      }
      wrap.appendChild(art);
    });
    cSection.appendChild(wrap);
  }
  app.appendChild(cSection);

  // 소식 해설
  function newsBlock(id, title, note, items, catKey, cats) {
    var m = TRACK[id];
    var block = el("section", { class: "block", id: id, style: "--c:" + m.color }, [
      el("div", { class: "section-head" }, [
        el("h3", { text: title }), el("span", { class: "note", text: note }), el("span", { class: "count", text: items.length + "건" })
      ])
    ]);
    if (!items.length) {
      block.appendChild(el("p", { class: "empty", text: "대상 기간 새 소식 없음" }));
      return block;
    }
    var present = (cats || []).filter(function (cat) { return items.some(function (it) { return it[catKey] === cat; }); });
    if (present.length > 1) {
      var bar = el("div", { class: "filters", role: "group", "aria-label": "분야로 거르기" });
      ["전체"].concat(present).forEach(function (cat) {
        var b = el("button", { type: "button", "aria-pressed": String(cat === "전체"), text: cat });
        b.addEventListener("click", function () {
          bar.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
          block.querySelectorAll(".item").forEach(function (row) {
            row.hidden = !(cat === "전체" || row.getAttribute("data-cat") === cat);
          });
        });
        bar.appendChild(b);
      });
      block.appendChild(bar);
    }
    block.appendChild(el("ul", { class: "items" }, items.map(function (it) {
      var cat = it[catKey] || "기타";
      return el("li", { class: "item", "data-cat": cat }, [
        el("span", { class: "cat", text: cat }),
        el("div", { class: "body" }, [
          el("span", { class: "title", text: it.title || "" }),
          it.detail ? el("div", { class: "detail" }, paras(it.detail)) : null,
          it.impact ? el("span", { class: "impact", text: it.impact }) : null,
          el("div", { class: "meta" }, [
            el("span", { class: "date", text: it.date || "날짜 미확인" }),
            it.reported ? el("span", { class: "badge", text: "보도" }) : null
          ].concat(links(it.sources)))
        ])
      ]);
    })));
    return block;
  }
  app.appendChild(el("section", { style: "display:grid;gap:36px" }, [
    el("h2", { text: "소식 해설", style: "margin:0" }),
    newsBlock("domain", "도메인 소식", TRACK.domain.full, domain, "kind", ["사례", "방법론", "제품", "연구"]),
    newsBlock("tech", "기술 소식", TRACK.tech.full, tech, "area", TECH_AREAS)
  ]));

  // 확인한 출처
  var checked = data.checked || {};
  var rows = [];
  if ((checked.domain || []).length) rows.push([TRACK.domain.name, checked.domain]);
  if ((checked.tech || []).length) rows.push([TRACK.tech.name, checked.tech]);
  if (rows.length) {
    app.appendChild(el("footer", null, [
      el("h2", { text: "확인한 출처", style: "margin:0" }),
      el("dl", null, [].concat.apply([], rows.map(function (r) {
        return [el("dt", { text: r[0] }), el("dd", { class: "mono", text: r[1].join(" · ") })];
      })))
    ]));
  }
})();
</script>
</body>
</html>
