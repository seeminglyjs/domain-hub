<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지식 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 배치: 날짜별 읽을거리. 맨 위 핵심 3건, 그다음 개념 풀이 한 편(긴 글), 그 아래 도메인 · 기술 소식 해설 */
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --fg: #1c1b19;
  --muted: #615f59;
  --line: #e4e1da;
  --accent: #2f5fb3;
  --domain: #0f7c74;
  --tech: #5a4bc2;
  --warn-bg: #fff3d6;
  --warn-fg: #7a5600;
  --chip-bg: #efede8;
  --code-bg: #f1efe9;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131416; --surface: #1b1c1f; --fg: #e9e7e2; --muted: #a09d96; --line: #2c2d31;
    --accent: #8fb0ff; --domain: #4fd1c5; --tech: #a99cff;
    --warn-bg: #3a2f12; --warn-fg: #f2cf7a; --chip-bg: #26272b; --code-bg: #222327; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131416; --surface: #1b1c1f; --fg: #e9e7e2; --muted: #a09d96; --line: #2c2d31;
  --accent: #8fb0ff; --domain: #4fd1c5; --tech: #a99cff;
  --warn-bg: #3a2f12; --warn-fg: #f2cf7a; --chip-bg: #26272b; --code-bg: #222327; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 var(--font-body); padding: 0 16px; word-break: keep-all; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 40px 64px; display: grid; gap: 44px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header { display: grid; gap: 10px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); line-height: 1.2; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.range { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 13px/1.5 var(--font-mono); color: var(--muted); }
.tally { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tally a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; }
.tally a:hover { border-color: var(--muted); }
.tally b { font: 500 13px var(--font-mono); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }

/* 핵심 */
.highlights { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.hl { display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.hl .rank { grid-row: span 3; font: 500 26px/1 var(--font-mono); color: var(--c); padding-top: 2px; }
.hl .who { font-size: 12px; font-weight: 600; color: var(--c); }
.hl .title { font-size: 17px; font-weight: 600; line-height: 1.45; min-width: 0; }
.hl .impact { color: var(--muted); min-width: 0; }

/* 개념 풀이 */
.concepts { display: grid; gap: 28px; }
.concept { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 12px; padding: 28px 32px; display: grid; gap: 18px; scroll-margin-top: 16px; }
.concept .tag { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; font-weight: 600; color: var(--c); }
.concept .tag .area { padding: 2px 8px; border-radius: 6px; border: 1px solid var(--c); }
.concept h3 { margin: 0; font-size: clamp(21px, 4vw, 26px); line-height: 1.35; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.concept .oneline { margin: 0; font-size: 16px; line-height: 1.7; padding: 12px 16px; border-radius: 8px; background: var(--chip-bg); }
.concept .related { margin: 0; font-size: 13px; color: var(--muted); }
.concept .related::before { content: "그날 소식과 연결 · "; font-weight: 600; color: var(--fg); }
.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--accent); text-decoration: underline; }
.csec { display: grid; gap: 6px; scroll-margin-top: 16px; }
.csec h4 { margin: 0; font-size: 16px; font-weight: 700; color: var(--fg); }
.csec h4 .n { font: 500 13px var(--font-mono); color: var(--c); margin-right: 8px; }
.csec p { margin: 0; line-height: 1.85; max-width: 68ch; overflow-wrap: anywhere; }
.csec p + p { margin-top: 8px; }
pre.code { margin: 6px 0 0; padding: 14px 16px; border-radius: 8px; background: var(--code-bg); font: 13px/1.6 var(--font-mono); overflow-x: auto; max-width: 100%; }
.code-note { font-size: 12px; color: var(--muted); }
.glossary { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; padding: 14px 16px; border-radius: 8px; background: var(--chip-bg); font-size: 14px; }
.glossary dt { font-weight: 600; }
.glossary dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.refs { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.refs a { overflow-wrap: anywhere; }

/* 소식 해설 */
.block { display: grid; gap: 0; scroll-margin-top: 16px; }
.section-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding-bottom: 10px; border-bottom: 2px solid var(--c); }
.section-head h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.section-head .note { color: var(--muted); font-size: 13px; }
.section-head .count { margin-left: auto; font: 13px var(--font-mono); color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 2px; }
.filters button { font: 500 13px var(--font-body); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.item .cat { align-self: start; justify-self: start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.item .body { display: grid; gap: 6px; min-width: 0; }
.item .title { font-weight: 600; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.item .detail { margin: 0; line-height: 1.85; max-width: 68ch; overflow-wrap: anywhere; }
.item .detail p { margin: 0; }
.item .detail p + p { margin-top: 8px; }
.item .impact { justify-self: start; max-width: 68ch; padding: 8px 12px; border-radius: 8px; background: var(--chip-bg); overflow-wrap: anywhere; }
.item .impact::before { content: "확인할 점 · "; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.meta .date { font-family: var(--font-mono); }
.meta a { overflow-wrap: anywhere; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--warn-bg); color: var(--warn-fg); }
.empty { padding: 18px 0; color: var(--muted); border-bottom: 1px solid var(--line); }

footer { display: grid; gap: 8px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
footer dt { font-weight: 600; color: var(--fg); }
footer dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.nodata { padding: 40px 0; color: var(--muted); }

@media (max-width: 560px) {
  .wrap { padding-block: 24px 48px; gap: 32px; }
  .hl { grid-template-columns: 1fr; padding: 16px; }
  .hl .rank { grid-row: auto; font-size: 18px; }
  .concept { padding: 20px 18px; }
  .item { grid-template-columns: 1fr; gap: 8px; }
  .glossary, footer dl { grid-template-columns: 1fr; }
  .glossary dd { margin-bottom: 6px; }
}
</style>
</head>
<body>
<main class="wrap" id="app">

</main>

{"heading": "동작 원리", "body": "첫째는 커밋을 묶는 것입니다. 자동 커밋(Autocommit)을 끄고 처음에 BEGIN, 끝에 COMMIT 을 한 번만 보내면 행마다 반복되던 커밋 비용이 사라집니다. 한 트랜잭션으로 넣으면 중간에 실패해도 앞의 행이 모두 롤백되어, 반만 들어간 상태가 남지 않습니다.\n둘째는 COPY 명령입니다. COPY 는 여러 행을 한 명령으로 넣는 PostgreSQL 전용 명령으로, 문서는 INSERT 보다 유연성은 낮지만 오버헤드가 훨씬 적다고 설명합니다. 문서는 준비된 문장(Prepared Statement)과 배치 트랜잭션을 써도 COPY 가 거의 항상 더 빠르다고 적고, COPY 를 쓸 수 없을 때만 PREPARE 와 EXECUTE 반복을 권합니다.\n셋째는 인덱스와 외래 키를 나중에 만드는 것입니다. 이미 들어간 데이터로 인덱스를 한 번에 만드는 것이 행마다 인덱스를 갱신하는 것보다 빠릅니다. 외래 키가 있는 테이블은 행마다 서버의 대기 트리거 이벤트 목록에 항목이 쌓이므로, 수백만 행을 넣으면 메모리가 부족해 실패할 수도 있다고 문서는 경고합니다.\n넷째는 WAL(Write-Ahead Log, 변경 기록 파일)과 체크포인트(Checkpoint, 메모리에서 바뀐 페이지를 디스크에 모두 기록하는 시점) 비용입니다. 대량 적재는 체크포인트를 평소 주기보다 자주 일으키므로, 문서는 적재 동안 max_wal_size 를 잠시 올려 체크포인트 수를 줄이라고 권합니다. 마지막으로 적재 뒤에는 ANALYZE 로 통계를 새로 모아야 질의 계획기가 바뀐 데이터 분포에 맞는 계획을 세웁니다.\n2026-11-17 공개된 pg_fastload 는 같은 문제를 병렬 처리로 다룹니다. 파일 읽기 · 파싱 · 행 만들기를 여러 백그라운드 워커가 나눠 하고, 테이블에 넣는 단계만 하나로 남깁니다."},
{"heading": "예시 장면", "body": "아래는 설명을 위한 가상 장면이며, 시각과 수치는 모두 예시 수치입니다. 쇼핑몰의 가격 반영 작업은 인덱스가 없는 스테이징 테이블(Staging Table, 본 테이블에 넣기 전에 잠시 받아 두는 테이블) price_import 와 본 테이블 product_price 를 씁니다.\n02:00 에 작업이 트랜잭션을 열고 price_import 를 TRUNCATE 한 뒤, 같은 트랜잭션에서 COPY price_import FROM STDIN 으로 파일 내용을 DB 연결을 통해 보냅니다. 300만 행이 한 명령으로 들어가고, 스테이징 테이블에는 인덱스가 없어 행마다 갱신할 인덱스도 없습니다.\n02:03 에 작업은 price_import 에 ANALYZE 를 실행하고, 상품 ID 가 비었거나 가격이 음수인 행의 수를 조회합니다. 이 수가 정해 둔 기준보다 많으면 COMMIT 대신 ROLLBACK 하고 경고를 남기므로, 본 테이블은 어제 가격 그대로 남습니다.\n검사를 통과하면 02:04 에 INSERT ... SELECT ... ON CONFLICT 문 하나로 price_import 의 값을 product_price 에 반영하고 커밋합니다. 행마다 INSERT 와 커밋을 반복하던 이전 방식에서는 같은 작업이 두 시간 넘게 걸렸다고 가정하면, 차이는 커밋 횟수와 명령 횟수에서 나옵니다."},
{"heading": "실무에서 확인할 점", "body": "첫째, Spring 정기 작업이 JPA 로 행마다 저장하고 있는지 확인합니다. 행마다 저장할 수밖에 없다면 JDBC 배치를 쓰고, PostgreSQL JDBC 드라이버(PgJDBC)의 reWriteBatchedInserts 설정을 검토합니다. PgJDBC 문서는 이 설정의 기본값이 false 이며, 켜면 배치 INSERT 를 여러 VALUES 를 묶은 INSERT 하나로 바꿔 2~3배 빨라진다고 적습니다.\n둘째, COPY 를 쓴다면 파일 위치를 확인합니다. COPY 에 파일 이름을 적으면 애플리케이션 서버가 아니라 DB 서버가 그 파일을 읽고, 슈퍼유저나 pg_read_server_files 같은 역할이 있어야 합니다. 애플리케이션 서버에 있는 파일이라면 COPY ... FROM STDIN 으로 DB 연결을 통해 보내야 하며, PgJDBC 는 이를 위한 CopyManager API 를 제공합니다.\n셋째, 서버를 여러 대 띄운다면 적재 작업이 한 서버에서만 돌도록 분산 락으로 막았는지 확인합니다. 두 서버가 같은 파일을 동시에 넣으면 행이 두 번 들어가거나 TRUNCATE 가 서로의 적재를 지웁니다.\n넷째, 복제나 WAL 아카이빙을 쓰는 운영 DB 에서는 문서의 wal_level minimal 같은 설정 변경을 그대로 따르지 않습니다. 문서는 이 변경이 서버 재시작을 요구하고 이전 기본 백업을 복구에 쓸 수 없게 만든다고 적습니다. 대신 적재 시간대에 체크포인트가 너무 잦다는 경고가 로그에 남는지 보고 max_wal_size 를 조정할지 검토합니다."},
{"heading": "흔한 함정", "body": "첫째, 큰 적재를 한 트랜잭션으로 넣으면서 실패에 대비하지 않는 경우입니다. 문서에 따르면 COPY FROM 이 실패하면 이미 넣은 행은 보이지 않는 삭제 상태로 남아 디스크를 차지하므로, VACUUM 으로 공간을 회수해야 합니다. PostgreSQL 17 부터는 ON_ERROR ignore 옵션으로 형식이 잘못된 행을 버리고 계속 넣을 수 있지만, text · csv 형식에서만 쓸 수 있습니다.\n둘째, 이미 서비스 중인 테이블에서 속도를 위해 인덱스를 지우는 경우입니다. 문서는 인덱스가 없는 동안 다른 사용자의 질의가 느려질 수 있고, 유니크 인덱스를 지우면 그동안 중복 검사도 사라진다고 경고합니다. 스테이징 테이블에 먼저 넣고 본 테이블에는 한 문장으로 반영하면 본 테이블의 인덱스를 건드리지 않아도 됩니다.\n셋째, 적재 뒤에 ANALYZE 를 하지 않는 경우입니다. 통계가 옛 분포에 머물러 있으면 계획기가 실제와 다른 행 수를 가정해 나쁜 계획을 세울 수 있습니다. autovacuum 이 나중에 ANALYZE 를 해 줄 수 있지만, 적재 직후 바로 질의가 들어오는 작업이라면 직접 실행하는 편이 안전합니다."}
],

{"term": "COPY", "meaning": "파일이나 DB 연결로 받은 여러 행을 한 명령으로 테이블에 넣거나 꺼내는 PostgreSQL 전용 명령입니다."},
{"term": "자동 커밋(Autocommit)", "meaning": "문장 하나를 실행할 때마다 바로 커밋하는 동작으로, JDBC 연결의 기본값입니다."},
{"term": "준비된 문장(Prepared Statement)", "meaning": "한 번 파싱 · 계획한 문장을 값만 바꿔 여러 번 실행하는 방식입니다."},
{"term": "체크포인트(Checkpoint)", "meaning": "메모리에서 바뀐 데이터 페이지를 모두 디스크에 기록하는 시점으로, 잦아지면 디스크 쓰기가 늘어납니다."},
{"term": "스테이징 테이블(Staging Table)", "meaning": "원천 데이터를 본 테이블에 반영하기 전에 잠시 받아 두고 검사하는 테이블입니다."},

{"term": "pg_fastload", "meaning": "pg_bulkload 를 바탕으로 읽기 · 파싱 단계를 병렬로 나눈 PostgreSQL 대량 적재 오픈소스 도구입니다."}

{"kind": "방법론", "title": "Neo4j 가 업무 용어를 그래프 노드로 두고 승인 담당 역할 · 유효 기간 · 검사 규칙을 붙이는 도메인 온톨로지 구축 방법을 공개했습니다.", "detail": "Neo4j(그래프 데이터베이스 회사)의 Morgan Sénéchal 은 2026-11-17 기업용 AI 지식 계층 연재의 3장으로 도메인 온톨로지(Domain Ontology, 업무 용어의 의미와 관계를 정해 둔 체계)를 만드는 방법을 공개했습니다. 글은 용어집(Glossary)이 용어를 설명만 할 뿐 업무 과정 · 데이터 · 담당자와 연결하거나 강제하지 못한다는 문제에서 출발합니다. 가상의 은행에서 \"고객을 얼마나 잃었나\"에 세 팀이 3.2% · 1.1% · 4.7% 로 답한 것은 계산 오류가 아니라 이탈(churn) 정의가 달랐기 때문이라고 설명합니다.\n방법은 업무 용어를 DataConcept 노드로 두고 정의 · 상태(proposed · canonical · superseded) · 유효 기간 · 출처를 붙이며, 측정 속성은 DataAttribute 노드로, 검사할 수 있는 규칙은 BusinessRule 노드로 나누는 것입니다. 승인 담당자는 사람이 아니라 역할(Role)에 연결해, 담당자가 바뀌어도 책임이 이어지게 합니다. 파이프라인이 자동으로 뽑은 연결은 신뢰도와 함께 제안 상태로만 들어가고, 스튜어드(Steward, 승인 담당자)가 승인해야 표준 정의가 됩니다. 정의는 드물게 바뀌고 기준값은 자주 바뀌므로, 기준값을 규칙에 두어 정의를 고치지 않고 바꿀 수 있게 합니다. 같은 이름의 지표를 팀마다 다르게 계산하는 조직에서 정의와 담당자를 함께 관리하려는 사람에게 쓸모 있습니다.", "impact": "지표 정의를 코드나 문서로 관리하는 서비스라면, 정의마다 승인 상태 · 유효 기간 · 담당 역할이 기록되어 특정 날짜에 어떤 정의가 쓰였는지 조회할 수 있는지 확인합니다.", "date": "2026-11-17", "reported": false, "sources": [{"label": "Neo4j 블로그: The knowledge layer for enterprise AI: Domain Ontology", "url": "https://neo4j.com/blog/developer/the-knowledge-layer-for-enterprise-ai-domain-ontology/"}]},
{"kind": "제품", "title": "Neo4j 가 데이터 웨어하우스의 테이블을 옮기지 않고 그래프로 질의하는 Virtual Graph 를 정식 출시했습니다.", "detail": "Neo4j 는 데이터 웨어하우스(Data Warehouse, 여러 원천의 데이터를 분석용으로 모아 둔 저장소) 안의 테이블을 복사하지 않고 그 위에 그래프를 만드는 Virtual Graph 의 정식 출시(GA, General Availability)를 알렸습니다. 사용자가 Cypher(Neo4j 의 그래프 질의 언어)로 질의하면 Virtual Graph 가 이를 SQL 로 바꿔 웨어하우스 안에서 실행하고 결과만 돌려받습니다. 변환은 결정적이어서 같은 질의는 늘 같은 SQL 이 되고, EXPLAIN 으로 생성된 SQL 을 볼 수 있습니다.\n웨어하우스의 역할 · 행 단위 제한 · 마스킹이 그대로 적용되며, 지원 원천은 Snowflake(클라우드 데이터 웨어하우스 회사) · Databricks(데이터 · AI 분석 플랫폼 회사) · BigQuery(Google 의 클라우드 데이터 웨어하우스) · S3(AWS 의 객체 저장소)에 둔 Apache Iceberg(대용량 분석용 오픈 테이블 형식) 테이블입니다. 현재 Google Cloud 의 Neo4j Aura(Neo4j 의 클라우드 관리형 서비스)에서 쓸 수 있고, AWS · Azure 는 곧 지원한다고 밝혔습니다. 글은 응답에 초~분 단위가 걸려도 되는 읽기 전용 분석용이며, 트랜잭션 처리 · 계속되는 쓰기 · 밀리초 단위 탐색에는 맞지 않고 OPTIONAL MATCH · 최단 경로 문법 같은 일부 Cypher 기능이 빠져 있다고 적습니다. 관계 중심 분석을 하고 싶지만 데이터를 그래프 DB 로 옮기는 비용과 권한 관리가 부담인 데이터 팀에게 쓸모 있습니다.", "impact": "관계 탐색 분석을 위해 데이터를 그래프 DB 로 복사하려는 서비스라면, 복사 대신 원천에서 질의를 변환하는 방식으로 필요한 응답 시간과 질의 기능이 충족되는지 먼저 확인합니다.", "date": "날짜 미확인(게시 정보 2026-11-16, 시간대 미확인)", "reported": false, "sources": [{"label": "Neo4j 블로그: Neo4j Virtual Graph is now generally available", "url": "https://neo4j.com/blog/news/neo4j-virtual-graph-is-now-generally-available/"}]}
],

{"area": "인프라·보안", "title": "OpenJDK 의 Base64 디코더 하드웨어 가속 경로에서 원격 코드 실행으로 이어질 수 있는 메모리 손상 취약점(Java4Shell)이 공개되었습니다.", "detail": "보안 회사 Calif 는 2026-11-17 OpenJDK HotSpot(OpenJDK 의 기본 JVM 구현)의 x86-64 Base64 디코더 인트린직(Intrinsic, JIT 컴파일러가 특정 메서드를 CPU 전용 명령으로 바꾸는 최적화)에서 힙 경계 밖 쓰기 취약점 CVE-2026-114938 을 공개하고 Java4Shell 이라고 이름 붙였습니다. CVSS(Common Vulnerability Scoring System, 취약점 심각도 점수) 4.0 점수는 9.2 이며, 글은 공개 당일 OpenJDK 권고와 Oracle 의 2026년 11월 정기 보안 업데이트(Critical Patch Update)가 함께 나왔다고 적습니다. 영향 범위는 OpenJDK 17.0.6 이상과, 이를 바탕으로 만든 Temurin · Corretto · Oracle Java SE 같은 배포판입니다.\n취약 경로는 AVX-512 VBMI(일부 x86-64 CPU 의 확장 명령어 묶음)를 지원하는 CPU 에서만 쓰이며, ARM64 는 영향을 받지 않습니다. java.util.Base64 디코더가 C2 JIT(자주 쓰는 코드를 기계어로 다시 컴파일하는 HotSpot 컴파일러)로 컴파일된 뒤 형식이 어긋난 Base64 입력을 받으면 힙 메모리가 손상됩니다. 인증 처리 · 파일 업로드 · 네트워크 메시지 처리처럼 외부 입력을 Base64 로 푸는 곳이 모두 경로가 될 수 있으며, 연구진은 Spring Boot 와 Apache Struts 로 만든 예제 앱, Keycloak · Jenkins 같은 제품의 기본 설정에서 원격 코드 실행을 시연했다고 밝혔습니다. 패치 전 임시 조치로는 JVM 옵션 -XX:-UseBASE64Intrinsics 로 가속 경로를 끄는 방법이 제시되었습니다. 이 노트는 OpenJDK · Oracle 의 권고 원문을 직접 열어 확인하지 못했으므로 보도 표시를 붙입니다.", "impact": "x86-64 서버에서 Java 서비스를 돌린다면, 쓰는 JDK 배포판의 2026년 11월 보안 업데이트 적용 여부와 CPU 의 avx512vbmi 지원 여부를 확인하고, 바로 올릴 수 없으면 -XX:-UseBASE64Intrinsics 적용을 검토합니다.", "date": "2026-11-17", "reported": true, "sources": [{"label": "Calif: Java4Shell", "url": "https://calif.io/java4shell/"}]},
{"area": "프론트", "title": "Next.js 팀이 2026년 보안 권고가 51건으로 늘어난 이유와, 취약한 버전을 쓰면 개발 · 빌드 때 알려 주는 기능을 설명했습니다.", "detail": "Next.js 팀은 2026-11-17 보안 권고 수가 2024년 6건 · 2025년 14건 · 2026년 51건(글 작성일 기준)으로 늘어난 이유를 설명했습니다. 글은 AI 로 오래된 버그를 찾는 비용이 낮아진 것을 주된 이유로 들며, 올해 취약점의 70%는 1년 이상, 43%는 3년 이상 된 코드에서 나왔다고 밝힙니다. 이미지 최적화가 쓰는 외부 이미지 라이브러리에서 나온 취약점도 많아, 메모리 안전한 코덱으로 바꾸는 작업을 진행하고 있다고 적습니다.\n보안 수정은 대략 한 달에 한 번, 미리 알린 일정으로 나옵니다. Next.js 16.4 부터는 next dev 와 next build 가 지금 버전이 알려진 취약점에 해당하면 경고하고, 개발 도구 화면에도 같은 안내가 표시됩니다. 호스팅 환경과 프레임워크 사이의 해석 차이로 생기는 우회를 줄이려고, 배포 환경이 따라야 할 계약인 어댑터(Adapter)를 정식화하고 있다고도 밝혔습니다. Next.js 를 쓰는 팀이 보안 업데이트 주기를 계획하는 데 쓸모 있습니다.", "impact": "Next.js 를 직접 띄우는 서비스라면, 월 단위 보안 릴리스 공지를 받는 담당자와 적용 기한이 정해져 있는지, 16.4 이상에서 빌드 로그의 취약 버전 경고를 누가 보는지 확인합니다.", "date": "2026-11-17", "reported": false, "sources": [{"label": "Next.js 블로그: How we're using AI to make Next.js more secure", "url": "https://nextjs.org/blog/how-were-using-ai-to-make-nextjs-more-secure"}]},
{"area": "데이터·DB", "title": "Databricks 가 객체 저장소 위에 만든 Postgres 서비스에서 페이지 읽기의 99% 이상을 로컬 캐시로 처리하는 계층 구조를 공개했습니다.", "detail": "Databricks 블로그는 2026-11-17 Lakebase Postgres(Databricks 의 관리형 PostgreSQL 서비스)가 객체 저장소(Object Storage, 대량 데이터를 싸고 안전하게 보관하지만 응답이 느린 저장소)에 데이터를 두면서도 질의마다 그곳을 읽지 않는 구조를 설명했습니다. 구조는 네 층으로, 영구 상태가 없는 Postgres 계산 노드와 로컬 페이지 캐시, WAL(Write-Ahead Log, 변경 기록)을 다수결로 복제하는 Safekeeper, WAL 을 페이지로 바꿔 로컬 NVMe 디스크에 두는 Pageserver, 오래된 이력을 보관하는 객체 저장소입니다.\n읽기는 로컬 캐시, Pageserver, 객체 저장소 순서로 내려가며, 아래 층에서 가져온 것을 위 층이 캐시하므로 깊이 내려가는 비용은 한 번만 냅니다. 운영 표본 수치로 페이지 접근의 약 99.46%가 계산 노드 캐시에서, 약 0.54%가 Pageserver 에서 처리되었고 객체 저장소 요청은 초당 약 39건이었다고 밝힙니다. 계산 노드가 영구 상태를 갖지 않으므로 브랜치 · 복원이 데이터 복사 없는 메타데이터 작업이 되고, 쓰지 않을 때 계산 노드를 0대로 줄일 수 있습니다. 느린 저장소 앞에 캐시 층을 설계하는 개발자에게 참고가 되는 사례입니다.", "impact": "느린 원천 앞에 여러 층의 캐시를 두는 서비스라면, 층마다 적중률과 가장 아래 층까지 내려간 요청 수를 따로 집계하고 있는지 확인합니다.", "date": "2026-11-17", "reported": false, "sources": [{"label": "Databricks 블로그: Built on object storage, served from cache", "url": "https://www.databricks.com/blog/built-object-storage-served-cache"}]},
{"area": "데이터·DB", "title": "PostgreSQL 대량 적재 도구 pg_bulkload 에서 갈라져 나와 읽기 · 파싱을 병렬로 나눈 pg_fastload 1.0.0 이 공개되었습니다.", "detail": "postgresql.org 뉴스에 2026-11-17 오픈소스 프로젝트 pg_fastload 1.0.0 공개 글이 실렸습니다. pg_bulkload(PostgreSQL 에 대량 데이터를 빠르게 넣는 확장 도구) 3.1.23 의 소스를 갈라 만든 도구로, 기존 제어 파일 문법과 로그 형식을 유지합니다. PostgreSQL 공식 릴리스가 아니라 외부 프로젝트이며, PostgreSQL 15~19 를 지원하고 BSD 3-Clause 라이선스입니다.\n적재를 입력 읽기 · 레코드 파싱 · 튜플(Tuple, DB 안의 행 하나) 만들기 · 삽입 네 단계로 나누고, 앞의 세 단계는 백그라운드 워커가 병렬로, 삽입은 하나의 백엔드가 순서대로 처리합니다. 적재 전체가 한 트랜잭션이라 잘못된 행 하나가 적재 전체를 중단시키며, NOT NULL · CHECK 제약이나 STDIN 입력 같은 13가지 조건에서는 순차 경로로 돌아갑니다. 저자 자체 측정으로 1GiB CSV(약 737만 행, 16 vCPU)에서 1.37초가 걸려 COPY FROM 의 8.32초보다 약 6배 빨랐다고 밝히지만, 요약에 적힌 일부 배율은 본문 표와 맞지 않습니다. 초기 적재나 대량 이관 시간이 문제인 PostgreSQL 사용자에게 검토 대상이 될 수 있습니다.", "impact": "대량 이관 시간이 문제인 서비스라면, 외부 도구를 들이기 전에 COPY · 인덱스 나중 생성 · 커밋 묶기만으로 줄어드는 시간을 먼저 측정합니다.", "date": "2026-11-17", "reported": false, "sources": [{"label": "PostgreSQL 뉴스: pg_fastload 1.0.0 released", "url": "https://www.postgresql.org/about/news/pg_fastload-100-released-parallel-bulk-loading-for-postgresql-3445/"}]}
],
"checked": {"domain": ["Neo4j 블로그(Domain Ontology 11-17 · Virtual Graph 게시 정보 11-16)", "Databricks 블로그(11-17 Genie One 의료 데이터 글은 AI 도구 소식이라 제외 · 클린룸 · 해커톤 글은 제외 · 객체 저장소 캐시 글은 기술 칸에 실음)", "온톨로지 · 의사결정 지능 검색(기간 내 다른 새 발표 확인 못 함)", "dbt Labs 블로그(주소가 열리지 않아 확인 못 함)"], "tech": ["postgresql.org 뉴스(PostgreSQL 19 정식 출시는 11-19 예정이라 제외)", "InfoQ(Google SRE 책 2판은 Google 원 발표가 10-13 · Qwik 2.0 RC 는 10-01 출시라 기간 밖)", "spring.io 블로그(11-18 주간 소식 외 새 릴리스 없음)", "inside.java(11-16 Valhalla 발표 소개 1건, 기간 밖)", "Next.js 블로그", "Cloudflare 블로그(Quad9 글은 원 발표가 지난달이라 제외)", "GeekNews", "Calif 블로그(OpenJDK 권고 페이지는 403 으로 열지 못함)", "CNBC(11-17 Apple · NSA 장애는 원인 · 퍼진 경로 · 복구 방법이 공개되지 않아 제외)"]}}</script>

<script>
(function () {
  var TRACK = {
    domain: { name: "도메인", full: "의사결정 지원 · 데이터 플랫폼", color: "var(--domain)" },
    tech: { name: "기술", full: "서버 · DB · 프레임워크 · 아키텍처 · 운영", color: "var(--tech)" }
  };
  var TECH_AREAS = ["백엔드", "프론트", "데이터·DB", "인프라·보안", "아키텍처·운영"];

  var data;
  try { data = JSON.parse(document.getElementById("digest-data").textContent || "{}"); } catch (e) { data = {}; }
  if (!data || !data.date) return;

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "style") n.style.cssText = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
  function links(sources) {
    return (sources || []).map(function (s) {
      var u = safeUrl(s.url);
      return u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.label || hostOf(u) }) : null;
    });
  }
  function paras(text) {
    return String(text || "").split(/\n\s*\n|\n/).filter(function (t) { return t.trim(); }).map(function (t) { return el("p", { text: t.trim() }); });
  }

  var concepts = Array.isArray(data.concepts) ? data.concepts : [];
  var domain = Array.isArray(data.domain) ? data.domain : [];
  var tech = Array.isArray(data.tech) ? data.tech : [];

  document.title = "지식 노트 " + data.date;
  var app = document.getElementById("app");
  app.textContent = "";

  // 머리
  var tally = el("div", { class: "tally" }, [
    el("a", { href: "#concepts", style: "--c:var(--accent)" }, [el("span", { class: "dot" }), el("span", { text: "개념 풀이" }), el("b", { text: String(concepts.length) })]),
    el("a", { href: "#domain", style: "--c:" + TRACK.domain.color }, [el("span", { class: "dot" }), el("span", { text: "도메인 소식" }), el("b", { text: String(domain.length) })]),
    el("a", { href: "#tech", style: "--c:" + TRACK.tech.color }, [el("span", { class: "dot" }), el("span", { text: "기술 소식" }), el("b", { text: String(tech.length) })])
  ]);
  app.appendChild(el("header", null, [
    el("div", { class: "eyebrow", text: "지식 노트 · 도메인과 기술" }),
    el("h1", { text: data.date + (data.weekday ? " (" + data.weekday + ")" : "") + " 지식 노트" }),
    el("div", { class: "range" }, [
      el("span", { text: "대상 기간 " + (data.range ? data.range.from + " ~ " + data.range.to : "미기재") }),
      data.generatedAt ? el("span", { text: "작성 " + data.generatedAt }) : null,
      el("a", { href: "../index.html", text: "지식 노트 색인 →" })
    ]),
    tally
  ]));

  // 핵심
  var hls = data.highlights || [];
  var hlSection = el("section", null, [el("h2", { text: "핵심" })]);
  if (hls.length) {
    hlSection.appendChild(el("ol", { class: "highlights" }, hls.slice(0, 3).map(function (h, i) {
      var m = TRACK[h.track] || { name: "", color: "var(--accent)" };
      return el("li", { class: "hl", style: "--c:" + m.color }, [
        el("span", { class: "rank", text: String(i + 1).padStart(2, "0") }),
        el("span", { class: "who", text: m.name }),
        el("span", { class: "title", text: h.title || "" }),
        h.impact ? el("span", { class: "impact", text: h.impact }) : null
      ]);
    })));
  } else {
    hlSection.appendChild(el("p", { class: "empty", text: "대상 기간에 영향이 큰 새 소식이 없습니다." }));
  }
  app.appendChild(hlSection);

  // 개념 풀이
  var cSection = el("section", { id: "concepts", style: "scroll-margin-top:16px" }, [el("h2", { text: "개념 풀이" })]);
  if (!concepts.length) {
    cSection.appendChild(el("p", { class: "empty", text: "이번 회차 개념 풀이 없음" }));
  } else {
    var wrap = el("div", { class: "concepts" });
    concepts.forEach(function (c, ci) {
      var m = TRACK[c.track] || { name: "", color: "var(--accent)" };
      var cid = "c" + (ci + 1);
      var secs = Array.isArray(c.sections) ? c.sections : [];
      var art = el("article", { class: "concept", id: cid, style: "--c:" + m.color }, [
        el("div", { class: "tag" }, [el("span", { text: m.name + " 개념" }), c.area ? el("span", { class: "area", text: c.area }) : null]),
        el("h3", { text: c.title || "" }),
        c.oneLine ? el("p", { class: "oneline", text: c.oneLine }) : null,
        c.related ? el("p", { class: "related", text: c.related }) : null,
        secs.length > 2 ? el("nav", { class: "toc", "aria-label": "목차" }, secs.map(function (s, si) {
          return el("a", { href: "#" + cid + "-" + (si + 1), text: (si + 1) + ". " + (s.heading || "") });
        })) : null
      ]);
      secs.forEach(function (s, si) {
        var sec = el("section", { class: "csec", id: cid + "-" + (si + 1) }, [
          el("h4", null, [el("span", { class: "n", text: String(si + 1).padStart(2, "0") }), document.createTextNode(s.heading || "")])
        ].concat(paras(s.body)));
        if (s.code && s.code.text) {
          sec.appendChild(el("pre", { class: "code" }, [el("code", { text: s.code.text })]));
          if (s.code.note) sec.appendChild(el("span", { class: "code-note", text: s.code.note }));
        }
        art.appendChild(sec);
      });
      var gl = Array.isArray(c.glossary) ? c.glossary : [];
      if (gl.length) {
        art.appendChild(el("dl", { class: "glossary" }, [].concat.apply([], gl.map(function (g) {
          return [el("dt", { text: g.term || "" }), el("dd", { text: g.meaning || "" })];
        }))));
      }
      var refs = links(c.sources).filter(Boolean);
      if (refs.length) {
        art.appendChild(el("div", null, [
          el("h2", { text: "더 읽을 자료", style: "margin:0 0 6px" }),
          el("ol", { class: "refs" }, refs.map(function (a) { return el("li", null, [a]); }))
        ]));
      }
      wrap.appendChild(art);
    });
    cSection.appendChild(wrap);
  }
  app.appendChild(cSection);

  // 소식 해설
  function newsBlock(id, title, note, items, catKey, cats) {
    var m = TRACK[id];
    var block = el("section", { class: "block", id: id, style: "--c:" + m.color }, [
      el("div", { class: "section-head" }, [
        el("h3", { text: title }), el("span", { class: "note", text: note }), el("span", { class: "count", text: items.length + "건" })
      ])
    ]);
    if (!items.length) {
      block.appendChild(el("p", { class: "empty", text: "대상 기간 새 소식 없음" }));
      return block;
    }
    var present = (cats || []).filter(function (cat) { return items.some(function (it) { return it[catKey] === cat; }); });
    if (present.length > 1) {
      var bar = el("div", { class: "filters", role: "group", "aria-label": "분야로 거르기" });
      ["전체"].concat(present).forEach(function (cat) {
        var b = el("button", { type: "button", "aria-pressed": String(cat === "전체"), text: cat });
        b.addEventListener("click", function () {
          bar.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
          block.querySelectorAll(".item").forEach(function (row) {
            row.hidden = !(cat === "전체" || row.getAttribute("data-cat") === cat);
          });
        });
        bar.appendChild(b);
      });
      block.appendChild(bar);
    }
    block.appendChild(el("ul", { class: "items" }, items.map(function (it) {
      var cat = it[catKey] || "기타";
      return el("li", { class: "item", "data-cat": cat }, [
        el("span", { class: "cat", text: cat }),
        el("div", { class: "body" }, [
          el("span", { class: "title", text: it.title || "" }),
          it.detail ? el("div", { class: "detail" }, paras(it.detail)) : null,
          it.impact ? el("span", { class: "impact", text: it.impact }) : null,
          el("div", { class: "meta" }, [
            el("span", { class: "date", text: it.date || "날짜 미확인" }),
            it.reported ? el("span", { class: "badge", text: "보도" }) : null
          ].concat(links(it.sources)))
        ])
      ]);
    })));
    return block;
  }
  app.appendChild(el("section", { style: "display:grid;gap:36px" }, [
    el("h2", { text: "소식 해설", style: "margin:0" }),
    newsBlock("domain", "도메인 소식", TRACK.domain.full, domain, "kind", ["사례", "방법론", "제품", "연구"]),
    newsBlock("tech", "기술 소식", TRACK.tech.full, tech, "area", TECH_AREAS)
  ]));

  // 확인한 출처
  var checked = data.checked || {};
  var rows = [];
  if ((checked.domain || []).length) rows.push([TRACK.domain.name, checked.domain]);
  if ((checked.tech || []).length) rows.push([TRACK.tech.name, checked.tech]);
  if (rows.length) {
    app.appendChild(el("footer", null, [
      el("h2", { text: "확인한 출처", style: "margin:0" }),
      el("dl", null, [].concat.apply([], rows.map(function (r) {
        return [el("dt", { text: r[0] }), el("dd", { class: "mono", text: r[1].join(" · ") })];
      })))
    ]));
  }
})();
</script>
</body>
</html>
