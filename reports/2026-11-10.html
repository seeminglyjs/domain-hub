<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주간 지식 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 배치: 주간 읽을거리 — 맨 위 핵심 3건, 그다음 개념 풀이 두 편(긴 글), 그 아래 도메인 · 기술 소식 해설 */
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --fg: #1c1b19;
  --muted: #615f59;
  --line: #e4e1da;
  --accent: #2f5fb3;
  --domain: #0f7c74;
  --tech: #5a4bc2;
  --warn-bg: #fff3d6;
  --warn-fg: #7a5600;
  --chip-bg: #efede8;
  --code-bg: #f1efe9;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131416; --surface: #1b1c1f; --fg: #e9e7e2; --muted: #a09d96; --line: #2c2d31;
    --accent: #8fb0ff; --domain: #4fd1c5; --tech: #a99cff;
    --warn-bg: #3a2f12; --warn-fg: #f2cf7a; --chip-bg: #26272b; --code-bg: #222327; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131416; --surface: #1b1c1f; --fg: #e9e7e2; --muted: #a09d96; --line: #2c2d31;
  --accent: #8fb0ff; --domain: #4fd1c5; --tech: #a99cff;
  --warn-bg: #3a2f12; --warn-fg: #f2cf7a; --chip-bg: #26272b; --code-bg: #222327; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 var(--font-body); padding: 0 16px; word-break: keep-all; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 40px 64px; display: grid; gap: 44px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header { display: grid; gap: 10px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); line-height: 1.2; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.range { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 13px/1.5 var(--font-mono); color: var(--muted); }
.tally { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tally a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; }
.tally a:hover { border-color: var(--muted); }
.tally b { font: 500 13px var(--font-mono); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }

/* 핵심 */
.highlights { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.hl { display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.hl .rank { grid-row: span 3; font: 500 26px/1 var(--font-mono); color: var(--c); padding-top: 2px; }
.hl .who { font-size: 12px; font-weight: 600; color: var(--c); }
.hl .title { font-size: 17px; font-weight: 600; line-height: 1.45; min-width: 0; }
.hl .impact { color: var(--muted); min-width: 0; }

/* 개념 풀이 */
.concepts { display: grid; gap: 28px; }
.concept { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 12px; padding: 28px 32px; display: grid; gap: 18px; scroll-margin-top: 16px; }
.concept .tag { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; font-weight: 600; color: var(--c); }
.concept .tag .area { padding: 2px 8px; border-radius: 6px; border: 1px solid var(--c); }
.concept h3 { margin: 0; font-size: clamp(21px, 4vw, 26px); line-height: 1.35; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.concept .oneline { margin: 0; font-size: 16px; line-height: 1.7; padding: 12px 16px; border-radius: 8px; background: var(--chip-bg); }
.concept .related { margin: 0; font-size: 13px; color: var(--muted); }
.concept .related::before { content: "이번 주 소식과 연결 · "; font-weight: 600; color: var(--fg); }
.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--accent); text-decoration: underline; }
.csec { display: grid; gap: 6px; scroll-margin-top: 16px; }
.csec h4 { margin: 0; font-size: 16px; font-weight: 700; color: var(--fg); }
.csec h4 .n { font: 500 13px var(--font-mono); color: var(--c); margin-right: 8px; }
.csec p { margin: 0; line-height: 1.85; max-width: 68ch; overflow-wrap: anywhere; }
.csec p + p { margin-top: 8px; }
pre.code { margin: 6px 0 0; padding: 14px 16px; border-radius: 8px; background: var(--code-bg); font: 13px/1.6 var(--font-mono); overflow-x: auto; max-width: 100%; }
.code-note { font-size: 12px; color: var(--muted); }
.glossary { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; padding: 14px 16px; border-radius: 8px; background: var(--chip-bg); font-size: 14px; }
.glossary dt { font-weight: 600; }
.glossary dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.refs { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.refs a { overflow-wrap: anywhere; }

/* 소식 해설 */
.block { display: grid; gap: 0; scroll-margin-top: 16px; }
.section-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding-bottom: 10px; border-bottom: 2px solid var(--c); }
.section-head h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.section-head .note { color: var(--muted); font-size: 13px; }
.section-head .count { margin-left: auto; font: 13px var(--font-mono); color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 2px; }
.filters button { font: 500 13px var(--font-body); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.item .cat { align-self: start; justify-self: start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.item .body { display: grid; gap: 6px; min-width: 0; }
.item .title { font-weight: 600; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.item .detail { margin: 0; line-height: 1.85; max-width: 68ch; overflow-wrap: anywhere; }
.item .detail p { margin: 0; }
.item .detail p + p { margin-top: 8px; }
.item .impact { justify-self: start; max-width: 68ch; padding: 8px 12px; border-radius: 8px; background: var(--chip-bg); overflow-wrap: anywhere; }
.item .impact::before { content: "확인할 점 · "; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.meta .date { font-family: var(--font-mono); }
.meta a { overflow-wrap: anywhere; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--warn-bg); color: var(--warn-fg); }
.empty { padding: 18px 0; color: var(--muted); border-bottom: 1px solid var(--line); }

footer { display: grid; gap: 8px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
footer dt { font-weight: 600; color: var(--fg); }
footer dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.nodata { padding: 40px 0; color: var(--muted); }

@media (max-width: 560px) {
  .wrap { padding-block: 24px 48px; gap: 32px; }
  .hl { grid-template-columns: 1fr; padding: 16px; }
  .hl .rank { grid-row: auto; font-size: 18px; }
  .concept { padding: 20px 18px; }
  .item { grid-template-columns: 1fr; gap: 8px; }
  .glossary, footer dl { grid-template-columns: 1fr; }
  .glossary dd { margin-bottom: 6px; }
}
</style>
</head>
<body>
<main class="wrap" id="app">
  <p class="nodata">보고서 데이터가 없습니다.</p>
</main>

<script id="digest-data" type="application/json">{"date": "2026-11-10", "weekday": "화", "range": {"from": "11-03 10:00", "to": "11-10 10:00"}, "generatedAt": null, "highlights": [{"track": "tech", "title": "Next.js 가 16.4.5 · 15.5.29 에서 캐시 관련 정보 노출 등 취약점 7건을 고쳤습니다.", "impact": "Next.js 를 쓰는 서비스라면 버전을 확인하고 패치 버전으로 올립니다."}, {"track": "domain", "title": "Snowflake 가 업무 용어의 승인된 의미를 관리하는 Business Ontology 를 발표했습니다.", "impact": "지표의 의미와 계산을 나누고 승인 절차를 두는 구조를 자기 서비스의 지표 정의 방식과 비교해 봅니다."}, {"track": "tech", "title": "Kernel 이 유출된 API 키에서 시작해 로깅 업체와 호스팅 계정까지 번진 보안 사고를 공개했습니다.", "impact": "로그와 외부 로깅 서비스에 API 키나 비밀 값이 남지 않는지 확인합니다."}], "concepts": [{"track": "tech", "area": "과부하", "title": "캐시 스탬피드(Cache Stampede) — 만료 순간 몰리는 재계산 막기", "oneLine": "캐시 항목이 만료되는 순간 많은 요청이 동시에 같은 값을 다시 계산하면서 DB 같은 공유 자원이 과부하에 빠지는 현상입니다. 도그파일링(dog-piling)이라고도 부릅니다.", "related": "이번 주 Next.js 보안 패치 가운데 하나는 캐시가 비어 있는 상태에서 동시에 들어온 호출이 결과를 잘못 공유한 문제여서, 캐시를 채우는 순간의 동시성을 다룬다는 점에서 이어집니다.", "sections": [{"heading": "왜 필요한가", "body": "캐시는 무거운 계산 결과를 잠시 저장해 DB 부하를 줄이는 장치입니다. 문제는 자주 읽히는 항목 하나가 만료되는 순간에 생깁니다. 그 순간 들어온 요청은 모두 캐시 미스(Cache Miss, 캐시에 값이 없음)를 보고 각자 DB 에 같은 조회를 보냅니다.\n평소 캐시가 막아 주던 부하가 한꺼번에 DB 로 넘어가면 응답이 느려집니다. 응답이 느려질수록 재계산이 더 많이 겹치고, 캐시가 다시 채워지지 않는 상태가 이어질 수 있습니다. 위키백과는 이 상태를 캐시 적중률이 0 으로 떨어지고 시스템이 계속 과부하에 머무는 연쇄 장애로 설명합니다."}, {"heading": "동작 원리", "body": "동시에 겹치는 재계산 수는 대략 재계산에 걸리는 시간과 초당 요청 수를 곱한 값입니다. 위키백과의 예시 수치로는 렌더링에 3초가 걸리고 초당 10건이 들어올 때 약 30개 프로세스가 같은 페이지를 동시에 다시 만듭니다.\n막는 방법은 세 가지로 나뉩니다. 첫째는 락(Lock, 한 번에 하나만 들어가게 하는 잠금)으로, 캐시 미스가 난 요청 가운데 락을 얻은 하나만 재계산하고 나머지는 기다리거나 오래된 값을 씁니다. 둘째는 외부 재계산(External Recomputation)으로, 요청을 처리하는 프로세스 대신 별도 작업이 만료 전에 값을 다시 채웁니다.\n셋째는 확률적 조기 만료(Probabilistic Early Expiration)입니다. 각 요청이 만료 시각에 가까워질수록 높아지는 확률로 미리 재계산할지 스스로 정하므로, 재계산 시점이 흩어집니다. Vattani 등의 2015년 VLDB(데이터베이스 분야 국제 학회) 논문이 이 방식을 다루며, 위키백과는 매개변수 beta 를 1 로 두어도 실제로 잘 동작한다고 적습니다."}, {"heading": "예시 장면", "body": "아래는 설명을 위한 가상 장면이며, 수치는 모두 예시 수치입니다. 공개된 사후 분석 사례는 이번 회차에 확인하지 못했습니다.\n10:00:00 에 쇼핑몰 관리 화면이 읽는 '오늘 상품별 매출 요약' 캐시가 만료됩니다. 이 요약을 만드는 집계 쿼리는 2초가 걸리고, 화면 요청은 초당 50건 들어옵니다.\n10:00:00~10:00:02 사이에 약 100건의 요청이 각자 같은 집계 쿼리를 DB 로 보냅니다. 서버의 DB 커넥션 풀(Connection Pool)은 10개뿐이어서 나머지 요청은 커넥션을 기다립니다.\n같은 풀을 쓰는 다른 API 도 커넥션을 얻지 못해 타임아웃이 납니다. 락이나 미리 채우기가 있었다면 집계 쿼리는 한 번만 돌고, 나머지 요청은 2초 뒤 같은 결과를 받았을 것입니다."}, {"heading": "실무에서 확인할 점", "body": "Spring 의 @Cacheable(메서드 결과를 캐시에 저장하게 하는 애너테이션)에는 sync 속성이 있습니다. 공식 문서는 sync=true 이면 값을 계산하는 동안 캐시 공급자(Cache Provider, 값을 실제로 저장하는 캐시 구현체)가 그 항목을 잠그고, 한 스레드만 계산하며 나머지는 기다린다고 설명합니다.\n서버를 여러 대 띄우는 서비스라면 이 잠금이 어디까지 미치는지 확인합니다. 문서는 잠금을 캐시 공급자에 맡긴다고만 적으므로, 서버마다 따로 두는 메모리 캐시라면 서버 수만큼 재계산이 일어날 수 있습니다. Redis(메모리 기반 키-값 저장소) 같은 공유 캐시를 쓴다면 그 공급자의 문서에서 여러 서버 사이의 동시 재계산을 막는지 확인합니다.\n무거운 요약 값은 요청이 아니라 정기 작업(스케줄러)이 미리 채우는 외부 재계산 방식이 맞는지도 검토할 수 있습니다. 같은 TTL(Time To Live, 만료 시간)로 한꺼번에 만료되는 키 묶음이 있는지도 함께 봅니다.", "code": {"text": "@Cacheable(cacheNames=\"foos\", sync=true)\npublic Foo executeExpensiveOperation(String id) {...}", "note": "Spring Framework 참조 문서 'Declarative Annotation-based Caching' 의 Synchronized Caching 예시입니다."}}, {"heading": "흔한 함정", "body": "첫째, 락만 걸고 락을 잡은 프로세스가 죽는 경우를 대비하지 않으면 다른 요청이 계속 기다립니다. 위키백과는 락 보유자 장애 · 락 TTL 설정 · 경쟁 상태(Race Condition, 실행 순서에 따라 결과가 달라지는 상태)를 올바르게 다루기 어렵다고 지적합니다.\n둘째, 외부 재계산을 모든 키에 쓰려고 하면 맞지 않습니다. 이 방식은 고정된 키에 맞고, 상품 ID 처럼 요청마다 달라지는 키에는 잘 맞지 않습니다.\n셋째, 확률적 조기 만료는 재계산 소요 시간과 만료 시각을 캐시 항목과 함께 저장해야 하므로 메모리 사용량이 늘어납니다. 이 비용을 계산하지 않고 모든 캐시에 적용하면 캐시 용량이 부족해질 수 있습니다."}], "glossary": [{"term": "캐시 미스(Cache Miss)", "meaning": "요청한 값이 캐시에 없어 원래 저장소에서 다시 읽거나 계산해야 하는 상황입니다."}, {"term": "TTL(Time To Live)", "meaning": "캐시 항목이 저장된 뒤 만료될 때까지의 시간입니다."}, {"term": "도그파일링(Dog-piling)", "meaning": "캐시 스탬피드의 다른 이름으로, 여러 요청이 한 자원에 한꺼번에 몰리는 모습을 가리킵니다."}, {"term": "커넥션 풀(Connection Pool)", "meaning": "DB 연결을 미리 몇 개 열어 두고 요청마다 빌려 쓰는 구조로, 개수가 정해져 있어 다 쓰이면 나머지 요청이 기다립니다."}, {"term": "확률적 조기 만료(Probabilistic Early Expiration)", "meaning": "만료 시각에 가까울수록 높아지는 확률로 각 요청이 미리 재계산할지 정하게 해 재계산 시점을 흩어 놓는 방법입니다."}, {"term": "@Cacheable", "meaning": "Spring 에서 메서드 결과를 캐시에 저장하고 다음 호출에 저장된 값을 돌려주게 하는 애너테이션입니다."}, {"term": "VLDB(Very Large Data Bases)", "meaning": "데이터베이스 분야의 국제 학회로, 이 글의 확률적 조기 만료 논문이 실린 곳입니다."}], "sources": [{"label": "위키백과: Cache stampede", "url": "https://en.wikipedia.org/wiki/Cache_stampede"}, {"label": "Spring Framework 문서: 캐시 애너테이션(sync)", "url": "https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html"}, {"label": "Vattani 외, Optimal Probabilistic Cache Stampede Prevention (VLDB 2015, PDF)", "url": "https://www.vldb.org/pvldb/vol8/p886-vattani.pdf"}]}, {"track": "domain", "area": "시맨틱 레이어", "title": "시맨틱 레이어(Semantic Layer) — 지표 정의를 한 곳에 두기", "oneLine": "매출 같은 업무 지표를 어떤 테이블에서 어떻게 조인 · 집계하는지 한 곳에 정의하고, 화면 · 보고서 · AI 에이전트가 모두 그 정의를 불러 쓰게 하는 계층입니다.", "related": "이번 주 Snowflake 가 발표한 Business Ontology 는 지표의 의미와 계산을 나눠 맡기는 구조여서, 시맨틱 레이어가 어디까지 맡는지 보여 주는 사례입니다.", "sections": [{"heading": "왜 필요한가", "body": "매출 같은 지표의 계산 규칙이 BI 도구(Business Intelligence, 대시보드와 보고서를 만드는 도구, 예: Tableau · Looker)마다 따로 있으면, 사업부마다 같은 매출(revenue)을 다르게 계산하게 됩니다. dbt(SQL 로 데이터 웨어하우스 안의 데이터를 가공 · 관리하는 오픈소스 도구) 문서도 이 문제를 시맨틱 레이어가 필요한 이유로 듭니다. 같은 이름의 숫자가 화면마다 다르면 보는 사람은 어느 숫자도 믿지 않게 됩니다.\n예를 들어 매출 대시보드는 환불을 뺀 금액을 쓰고 월간 보고서는 환불을 넣은 금액을 쓰면, 보는 사람은 두 숫자가 왜 다른지 묻게 됩니다. 시맨틱 레이어는 이런 정의를 한 곳으로 모아, 어느 도구를 쓰든 같은 정의를 쓰게 합니다."}, {"heading": "동작 원리", "body": "dbt Semantic Layer 는 지표를 BI 도구가 아니라 모델링 계층(원천 데이터를 분석용 테이블로 가공하는 단계)에서 한 번 정의합니다. 사용자가 지표를 요청하면 MetricFlow 라는 엔진이 정의에 맞춰 필요한 조인을 처리합니다. 정의를 바꾸면 그 지표를 부르는 모든 곳에 반영됩니다.\nSnowflake(클라우드 데이터 웨어하우스 회사)는 이번 발표에서 맥락을 세 층으로 나눴습니다. Business Ontology 는 승인된 의미를 저장하고, Semantic View 는 조인 · 필터 · 집계 같은 계산을 맡고, Cortex Sense 는 정의되지 않은 맥락을 추론합니다.\nSnowflake 엔지니어링 블로그는 온톨로지가 수식을 저장만 하고 실행하지 않는다고 밝힙니다. 사람이 승인한 정의가 추론보다 우선한다는 점도 함께 적습니다."}, {"heading": "예시 장면", "body": "Snowflake 엔지니어링 블로그의 예시를 줄여 옮깁니다. 같은 '순매출(Net Revenue)' 이라도 재무 도메인은 환불과 할인을 뺀 인식 매출로, 영업 도메인은 계약 시점에 할인을 뺀 수주 금액으로 정의합니다.\n사용자가 에이전트에게 지난 분기 순매출을 물으면, 에이전트는 두 정의를 보여 주고 어느 쪽인지 묻습니다. 사용자가 재무를 고르면 에이전트는 재무 도메인의 Semantic View 지표를 써서 답하고, 그 수치를 승인된(governed) 수치로 표시합니다.\n답에는 내부 거래 송장과 테스트 계정이 빠진다는 안내도 붙습니다. 같은 이름의 지표가 둘 있어도, 어느 정의를 썼는지가 답과 함께 드러나는 장면입니다."}, {"heading": "실무에서 확인할 점", "body": "첫째, 매출 같은 지표를 계산하는 SQL 이 여러 서비스나 API 에 따로 적혀 있는지 확인합니다.\n둘째, 같은 이름의 지표가 화면마다 다른 조건(기간 · 시간대 · 대상 범위)으로 계산되는지 확인합니다. 셋째, 지표 정의를 바꿀 때 누가 승인했는지 기록이 남는지 확인합니다.\n별도 도구를 들이지 않아도 PostgreSQL 뷰(View, 저장해 둔 조회문)나 공용 조회 함수 하나에 지표 정의를 모으는 것부터 시작할 수 있습니다. 사람이 검토한 뒤 결과를 내보내는 서비스라면, 결과와 함께 어느 지표 정의를 썼는지 보이는 것이 Snowflake 예시와 같은 방향입니다."}, {"heading": "흔한 함정", "body": "첫째, 정의만 모으고 소유자와 승인 절차를 두지 않으면 같은 이름에 다른 의미가 다시 섞입니다. Snowflake 가 개념마다 소속 도메인과 스튜어드(Steward, 승인 담당자)를 두는 이유가 여기에 있습니다.\n둘째, 의미 저장과 계산 실행을 한 계층에 모두 맡기려 하면 역할이 흐려집니다. Snowflake 는 온톨로지가 수식을 실행하지 않고 계산은 Semantic View 가 맡도록 나눴습니다.\n셋째, 정의를 바꾸면 모든 곳에 바로 반영되므로 검토 없이 바꾸면 과거 보고서와 숫자가 달라집니다. 정의 변경은 초안과 승인 단계를 거치게 하는 편이 안전합니다."}], "glossary": [{"term": "시맨틱 레이어(Semantic Layer)", "meaning": "원천 테이블과 화면 사이에서 업무 용어와 지표의 정의를 한 곳에 모아 두는 계층입니다."}, {"term": "지표(Metric)", "meaning": "매출 · 객단가처럼 원천 값을 집계해 업무 판단에 쓰는 숫자입니다."}, {"term": "BI 도구(Business Intelligence)", "meaning": "데이터를 불러와 대시보드와 보고서를 만드는 도구입니다. Tableau · Looker 가 대표적입니다."}, {"term": "dbt", "meaning": "데이터 웨어하우스 안의 데이터를 SQL 로 가공 · 관리하는 오픈소스 도구로, dbt Semantic Layer 는 그 위에서 지표를 정의하는 기능입니다."}, {"term": "데이터 웨어하우스(Data Warehouse)", "meaning": "여러 원천의 데이터를 분석용으로 모아 둔 저장소입니다. Snowflake 가 대표적인 클라우드 제품입니다."}, {"term": "MetricFlow", "meaning": "dbt Semantic Layer 에서 지표 정의를 읽고 요청에 맞는 조인과 집계를 처리하는 엔진입니다."}, {"term": "온톨로지(Ontology)", "meaning": "어떤 분야의 개념과 개념 사이 관계를 정해 둔 체계로, 여기서는 업무 용어의 승인된 의미를 담습니다."}, {"term": "도메인 스튜어드(Domain Steward)", "meaning": "한 업무 영역의 용어와 지표 정의를 승인하고 관리하는 담당자입니다."}], "sources": [{"label": "dbt 문서: dbt Semantic Layer", "url": "https://docs.getdbt.com/docs/use-dbt-semantic-layer/dbt-sl"}, {"label": "Snowflake 엔지니어링 블로그: Business Ontology", "url": "https://www.snowflake.com/en/blog/engineering/business-ontology-context/"}]}], "domain": [{"kind": "제품", "title": "Snowflake 가 업무 용어의 승인된 의미를 관리하는 Business Ontology 를 발표했습니다.", "detail": "Snowflake(클라우드 데이터 웨어하우스 회사)는 2026-11-03 자사 행사 Expedition 2026 에서 Horizon Context(Snowflake 안에서 승인된 업무 맥락을 모아 두는 기능)의 새 기능인 Business Ontology 를 발표했습니다. AI 에이전트가 순매출 같은 업무 용어를 제멋대로 해석하지 않도록, 사람이 승인한 정의만 에이전트에 주려는 것이 배경입니다.\nBusiness Ontology 는 용어 · 지표 · 정책 같은 개념을 그래프로 연결하고, 각 개념을 실제 테이블과 뷰에 연결합니다. 새 개념은 초안으로 시작하고, 승인된 개념을 고치면 도메인 스튜어드(Domain Steward, 그 업무 영역의 승인 담당자)가 수락할 때까지 에이전트는 기존 버전을 씁니다.\n온톨로지(Ontology, 개념과 관계를 정해 둔 체계)는 의미만 저장하고 계산은 Semantic View(지표의 조인 · 집계를 계산하는 Snowflake 기능)가 맡으며, 모든 변경은 기록으로 남습니다. 보도자료 기준으로 Business Ontology 는 공개 프리뷰 예정 상태이고, 엔지니어링 블로그는 비공개 프리뷰 단계라고 적습니다.", "impact": "지표 정의가 어디에 있고 누가 바꾸는지 정리할 때, 의미 · 계산 · 승인을 나누는 이 구조를 비교 기준으로 쓸 수 있습니다.", "date": "2026-11-03", "reported": false, "sources": [{"label": "Snowflake 보도자료", "url": "https://www.snowflake.com/en/news/press-releases/expedition-2026-business-ontology-ai-gateway/"}, {"label": "Snowflake 엔지니어링 블로그", "url": "https://www.snowflake.com/en/blog/engineering/business-ontology-context/"}]}], "tech": [{"area": "프론트", "title": "Next.js 가 16.4.5 · 15.5.29 에서 캐시 관련 정보 노출 등 취약점 7건을 고쳤습니다.", "detail": "Next.js 는 2026-11-03 정기 보안 릴리스로 16.4.5(Active LTS, 현재 장기 지원판)와 15.5.29(Maintenance LTS, 보안 수정만 받는 장기 지원판)를 냈습니다. 일주일 전 사전 공지로 팀들이 업그레이드를 미리 계획하게 한 회차입니다.\n가장 심각한 것(High)은 Cache Components(Next.js 의 컴포넌트 단위 캐시 기능)에서 unstable_cache 와 use cache(둘 다 Next.js 의 캐시 API)를 함께 쓸 때, 캐시가 비어 있는 동안 동시에 들어온 호출이 다른 테넌트(Tenant, 한 서비스를 함께 쓰는 고객 단위)의 결과를 받을 수 있는 문제입니다. 나머지 6건(Medium)은 중첩 use cache 의 루트 파라미터 노출, 바이너리 인자로 인한 캐시 키 충돌, 직접 운영 환경의 공유 셸 캐시 오염, 압축 응답 헤더 불일치로 인한 응답 뒤바뀜, Edge 라우트(Edge 런타임에서 도는 경로)의 쿠키 값 헤더 노출, 이미지 최적화의 SVG 차단 우회입니다.\n여러 항목은 Cache Components 를 켠 경우나 next start(Next.js 를 직접 서버로 띄우는 명령)로 직접 운영하는 경우에만 해당합니다. Next.js 로 여러 사용자나 테넌트의 데이터를 캐시하는 서비스에 특히 중요합니다.", "impact": "Next.js 를 쓰는 서비스라면 버전과 Cache Components · Edge 라우트 사용 여부를 확인하고 패치 버전으로 올립니다.", "date": "2026-11-03", "reported": false, "sources": [{"label": "Next.js 블로그: November 2026 Security Release", "url": "https://nextjs.org/blog/november-2026-security-release"}, {"label": "Next.js 블로그: 사전 공지", "url": "https://nextjs.org/blog/upcoming-nextjs-security-release-november-2026"}]}, {"area": "인프라·보안", "title": "Kernel 이 유출된 API 키에서 시작해 로깅 업체와 호스팅 계정까지 번진 보안 사고를 공개했습니다.", "detail": "브라우저 세션을 제공하는 Kernel 은 2026-11-04 보안 사고 공지를 올렸고, 전체 고객의 0.28% 가 영향을 받았다고 밝혔습니다. 사고는 11-02 고객 문의로 처음 인지됐습니다.\n공지에 따르면 공격자는 10-24 유출된 API 키로 내부 프로필 데이터를 읽었습니다. 10-27 에는 같은 키로 로깅 서비스 업체의 직원 로그인에 접근해, 일부 API 키와 고객 앱의 외부 비밀 값이 든 데이터를 내려받았습니다.\n11-03 에는 탈취한 호스팅 계정 자격 증명으로 GPU 서버 4대에 접근해 암호화폐 채굴을 시도했습니다. Kernel 은 자격 증명 폐기와 교체, IP 차단, 서버 격리를 했고, 범위를 좁힌 API 키와 키 사용 네트워크 통제를 재발 방지책으로 내놓았습니다.\n키 하나가 로그 저장소를 거쳐 다른 비밀 값으로 번진 경로를 보여 주므로, 외부 로깅 서비스를 쓰는 모든 팀에 참고가 됩니다.", "impact": "애플리케이션 로그와 외부 로깅 서비스에 API 키나 비밀 값이 남지 않는지, 키를 바로 교체할 절차가 있는지 확인합니다.", "date": "2026-11-04", "reported": false, "sources": [{"label": "Kernel 보안 사고 공지", "url": "https://www.kernel.sh/blog/public-notice-of-security-incident-nov-4-2026"}]}, {"area": "백엔드", "title": "Spring Boot 4.2.0-RC2 가 나와 4.2 정식 출시가 가까워졌습니다.", "detail": "Spring 팀은 2026-11-06 Spring Boot 4.2.0 의 두 번째 출시 후보(RC2)를 냈습니다. 정식 출시 전에 마지막으로 문제를 찾는 단계입니다.\n이번 RC2 에는 개선 · 문서 · 의존성 업그레이드 · 버그 수정 99건이 들어갔습니다. 공지가 꼽은 변경은 Reactor Netty(Spring WebFlux 가 쓰는 비동기 HTTP 서버)의 X-Forwarded-Prefix(프록시가 붙인 경로 앞부분을 전하는 HTTP 헤더) 지원과, spring.data.redis.database 설정이 master/replica(쓰기 서버와 읽기 복제 서버) 연결에도 적용되는 것입니다.\n공지 글은 4.2 정식 출시일과 4.2 전체 새 기능 목록을 적지 않고 릴리스 노트로 안내합니다. Spring Boot 4.x 를 쓰는 팀이 다음 업그레이드를 미리 시험해 볼 수 있는 시점입니다.", "impact": "Redis master/replica 구성에서 database 번호 설정을 쓰는지 확인하고, 정식 출시 전에 RC2 로 빌드와 테스트를 한 번 돌려 봅니다.", "date": "2026-11-06", "reported": false, "sources": [{"label": "Spring 블로그: Spring Boot 4.2.0-RC2", "url": "https://spring.io/blog/2026/11/06/spring-boot-4-2-0-RC2-available-now/"}]}], "checked": {"domain": ["Snowflake 보도자료 · 엔지니어링 블로그", "dbt 문서 · dbt 블로그(검색)", "Neo4j 블로그(검색, 기간 내 없음)", "Gartner · IDC 의사결정 지능 보도(검색, 기간 밖)", "NVIDIA Auto Ontology 보도(11-01, 기간 밖)", "SAP Ontology Manager 보도(날짜 미확인으로 제외)"], "tech": ["nextjs.org 블로그", "spring.io 블로그", "postgresql.org 뉴스(19 RC1 은 10-15 로 기간 밖)", "InfoQ Java 소식(기간 내 회차 없음)", "inside.java(기간 내 없음)", "AWS What's New(기간 내 확인 못 함)", "Cloudflare 블로그(기간 내 사후 분석 없음)", "Redis 보안 공지(기간 내 없음)", "GeekNews(기간 내 장애 글 없음)", "kernel.sh 블로그"]}}</script>

<script>
(function () {
  var TRACK = {
    domain: { name: "도메인", full: "의사결정 지원 · 데이터 플랫폼", color: "var(--domain)" },
    tech: { name: "기술", full: "서버 · DB · 프레임워크 · 아키텍처 · 운영", color: "var(--tech)" }
  };
  var TECH_AREAS = ["백엔드", "프론트", "데이터·DB", "인프라·보안", "아키텍처·운영"];

  var data;
  try { data = JSON.parse(document.getElementById("digest-data").textContent || "{}"); } catch (e) { data = {}; }
  if (!data || !data.date) return;

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "style") n.style.cssText = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
  function links(sources) {
    return (sources || []).map(function (s) {
      var u = safeUrl(s.url);
      return u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.label || hostOf(u) }) : null;
    });
  }
  function paras(text) {
    return String(text || "").split(/\n\s*\n|\n/).filter(function (t) { return t.trim(); }).map(function (t) { return el("p", { text: t.trim() }); });
  }

  var concepts = Array.isArray(data.concepts) ? data.concepts : [];
  var domain = Array.isArray(data.domain) ? data.domain : [];
  var tech = Array.isArray(data.tech) ? data.tech : [];

  document.title = "주간 지식 노트 " + data.date;
  var app = document.getElementById("app");
  app.textContent = "";

  // 머리
  var tally = el("div", { class: "tally" }, [
    el("a", { href: "#concepts", style: "--c:var(--accent)" }, [el("span", { class: "dot" }), el("span", { text: "개념 풀이" }), el("b", { text: String(concepts.length) })]),
    el("a", { href: "#domain", style: "--c:" + TRACK.domain.color }, [el("span", { class: "dot" }), el("span", { text: "도메인 소식" }), el("b", { text: String(domain.length) })]),
    el("a", { href: "#tech", style: "--c:" + TRACK.tech.color }, [el("span", { class: "dot" }), el("span", { text: "기술 소식" }), el("b", { text: String(tech.length) })])
  ]);
  app.appendChild(el("header", null, [
    el("div", { class: "eyebrow", text: "주간 지식 노트 · 도메인과 기술" }),
    el("h1", { text: data.date + (data.weekday ? " (" + data.weekday + ")" : "") + " 주간 지식 노트" }),
    el("div", { class: "range" }, [
      el("span", { text: "대상 기간 " + (data.range ? data.range.from + " ~ " + data.range.to : "미기재") }),
      data.generatedAt ? el("span", { text: "작성 " + data.generatedAt }) : null,
      el("a", { href: "../index.html", text: "지식 노트 색인 →" })
    ]),
    tally
  ]));

  // 핵심
  var hls = data.highlights || [];
  var hlSection = el("section", null, [el("h2", { text: "이번 주 핵심" })]);
  if (hls.length) {
    hlSection.appendChild(el("ol", { class: "highlights" }, hls.slice(0, 3).map(function (h, i) {
      var m = TRACK[h.track] || { name: "", color: "var(--accent)" };
      return el("li", { class: "hl", style: "--c:" + m.color }, [
        el("span", { class: "rank", text: String(i + 1).padStart(2, "0") }),
        el("span", { class: "who", text: m.name }),
        el("span", { class: "title", text: h.title || "" }),
        h.impact ? el("span", { class: "impact", text: h.impact }) : null
      ]);
    })));
  } else {
    hlSection.appendChild(el("p", { class: "empty", text: "대상 기간에 영향이 큰 새 소식이 없습니다." }));
  }
  app.appendChild(hlSection);

  // 개념 풀이
  var cSection = el("section", { id: "concepts", style: "scroll-margin-top:16px" }, [el("h2", { text: "이번 주 개념 풀이" })]);
  if (!concepts.length) {
    cSection.appendChild(el("p", { class: "empty", text: "이번 회차 개념 풀이 없음" }));
  } else {
    var wrap = el("div", { class: "concepts" });
    concepts.forEach(function (c, ci) {
      var m = TRACK[c.track] || { name: "", color: "var(--accent)" };
      var cid = "c" + (ci + 1);
      var secs = Array.isArray(c.sections) ? c.sections : [];
      var art = el("article", { class: "concept", id: cid, style: "--c:" + m.color }, [
        el("div", { class: "tag" }, [el("span", { text: m.name + " 개념" }), c.area ? el("span", { class: "area", text: c.area }) : null]),
        el("h3", { text: c.title || "" }),
        c.oneLine ? el("p", { class: "oneline", text: c.oneLine }) : null,
        c.related ? el("p", { class: "related", text: c.related }) : null,
        secs.length > 2 ? el("nav", { class: "toc", "aria-label": "목차" }, secs.map(function (s, si) {
          return el("a", { href: "#" + cid + "-" + (si + 1), text: (si + 1) + ". " + (s.heading || "") });
        })) : null
      ]);
      secs.forEach(function (s, si) {
        var sec = el("section", { class: "csec", id: cid + "-" + (si + 1) }, [
          el("h4", null, [el("span", { class: "n", text: String(si + 1).padStart(2, "0") }), document.createTextNode(s.heading || "")])
        ].concat(paras(s.body)));
        if (s.code && s.code.text) {
          sec.appendChild(el("pre", { class: "code" }, [el("code", { text: s.code.text })]));
          if (s.code.note) sec.appendChild(el("span", { class: "code-note", text: s.code.note }));
        }
        art.appendChild(sec);
      });
      var gl = Array.isArray(c.glossary) ? c.glossary : [];
      if (gl.length) {
        art.appendChild(el("dl", { class: "glossary" }, [].concat.apply([], gl.map(function (g) {
          return [el("dt", { text: g.term || "" }), el("dd", { text: g.meaning || "" })];
        }))));
      }
      var refs = links(c.sources).filter(Boolean);
      if (refs.length) {
        art.appendChild(el("div", null, [
          el("h2", { text: "더 읽을 자료", style: "margin:0 0 6px" }),
          el("ol", { class: "refs" }, refs.map(function (a) { return el("li", null, [a]); }))
        ]));
      }
      wrap.appendChild(art);
    });
    cSection.appendChild(wrap);
  }
  app.appendChild(cSection);

  // 소식 해설
  function newsBlock(id, title, note, items, catKey, cats) {
    var m = TRACK[id];
    var block = el("section", { class: "block", id: id, style: "--c:" + m.color }, [
      el("div", { class: "section-head" }, [
        el("h3", { text: title }), el("span", { class: "note", text: note }), el("span", { class: "count", text: items.length + "건" })
      ])
    ]);
    if (!items.length) {
      block.appendChild(el("p", { class: "empty", text: "대상 기간 새 소식 없음" }));
      return block;
    }
    var present = (cats || []).filter(function (cat) { return items.some(function (it) { return it[catKey] === cat; }); });
    if (present.length > 1) {
      var bar = el("div", { class: "filters", role: "group", "aria-label": "분야로 거르기" });
      ["전체"].concat(present).forEach(function (cat) {
        var b = el("button", { type: "button", "aria-pressed": String(cat === "전체"), text: cat });
        b.addEventListener("click", function () {
          bar.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
          block.querySelectorAll(".item").forEach(function (row) {
            row.hidden = !(cat === "전체" || row.getAttribute("data-cat") === cat);
          });
        });
        bar.appendChild(b);
      });
      block.appendChild(bar);
    }
    block.appendChild(el("ul", { class: "items" }, items.map(function (it) {
      var cat = it[catKey] || "기타";
      return el("li", { class: "item", "data-cat": cat }, [
        el("span", { class: "cat", text: cat }),
        el("div", { class: "body" }, [
          el("span", { class: "title", text: it.title || "" }),
          it.detail ? el("div", { class: "detail" }, paras(it.detail)) : null,
          it.impact ? el("span", { class: "impact", text: it.impact }) : null,
          el("div", { class: "meta" }, [
            el("span", { class: "date", text: it.date || "날짜 미확인" }),
            it.reported ? el("span", { class: "badge", text: "보도" }) : null
          ].concat(links(it.sources)))
        ])
      ]);
    })));
    return block;
  }
  app.appendChild(el("section", { style: "display:grid;gap:36px" }, [
    el("h2", { text: "이번 주 소식 해설", style: "margin:0" }),
    newsBlock("domain", "도메인 소식", TRACK.domain.full, domain, "kind", ["사례", "방법론", "제품", "연구"]),
    newsBlock("tech", "기술 소식", TRACK.tech.full, tech, "area", TECH_AREAS)
  ]));

  // 확인한 출처
  var checked = data.checked || {};
  var rows = [];
  if ((checked.domain || []).length) rows.push([TRACK.domain.name, checked.domain]);
  if ((checked.tech || []).length) rows.push([TRACK.tech.name, checked.tech]);
  if (rows.length) {
    app.appendChild(el("footer", null, [
      el("h2", { text: "확인한 출처", style: "margin:0" }),
      el("dl", null, [].concat.apply([], rows.map(function (r) {
        return [el("dt", { text: r[0] }), el("dd", { class: "mono", text: r[1].join(" · ") })];
      })))
    ]));
  }
})();
</script>
</body>
</html>
